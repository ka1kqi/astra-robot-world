[project]
name = "astra-robot-world"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mujoco>=3.13.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "trimesh>=5.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_world"]
